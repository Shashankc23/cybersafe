<!DOCTYPE html>
<html>
<head>
    <title>CyberSafe</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo_icon.png') }}">
    <script>
        (function () {
            var theme = localStorage.getItem('theme') || 'light';
            document.documentElement.classList.add(theme);
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='progress.js') }}"></script>
    <script src="{{ url_for('static', filename='lessons.js') }}"></script>
</head>
<body class="page-enter">
    <div id="page-loading-bar"></div>
    <div id="page-loading-overlay">
        <div class="loading-track">
            <img src="{{ url_for('static', filename='byte_pet.png') }}" class="loading-runner" alt="">
        </div>
        <div class="loading-text">Loading<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span></div>
    </div>
    <nav>
        <div class="nav-inner">
            <a href="/" class="nav-brand" aria-label="CyberSafe home">
                <img src="{{ url_for('static', filename='logo_icon.png') }}" width="30" height="30" style="object-fit: contain;" alt="">
                <span>CyberSafe</span>
            </a>
            <div class="nav-links">
                <a href="/modules">Modules</a>
                <a href="/pet">🐾 My Pet</a>
                <button id="theme-toggle" onclick="toggleTheme()">🌙</button>
            </div>
        </div>
    </nav>
    {% block content %}
    {% endblock %}
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    <script src="{{ url_for('static', filename='transitions.js') }}"></script>
    <footer>
    <p>© 2026 CyberSafe. Built to keep kids safe online.</p>
    <p>
        <a href="/">Home</a>
        <a href="/modules">Modules</a>
        <a href="/pet">My Pet</a>
        <a href="/settings">Settings</a>
    </p>
</footer>
</body>
</html>
