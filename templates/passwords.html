{% extends 'base.html' %}

{% block content %}
<div class="quiz-container">

    <div class="quiz-badges">
        <span class="badge">📖 Question {{ question_number }} / {{ total_questions }}</span>
        <span class="badge">⭐ Score: {{ score }}</span>
    </div>

    <div style="background: #e8eef8; border-radius: 50px; height: 8px; margin: 16px 0 30px 0;">
        <div style="background: #0057ff; height: 8px; border-radius: 50px; width: {{ (question_number / total_questions * 100) | int }}%; transition: width .4s ease;"></div>
    </div>

    <h1>🔐 Password Quiz</h1>
    <div class="quiz-intro">
        <img src="{{ url_for('static', filename='byte_pet.png') }}" class="quiz-byte-icon">
        <p>Byte is testing out a new password. Help Byte figure out if it's strong enough to keep hackers out.</p>
    </div>

    <div class="quiz-card">
        <div class="quiz-card-label">🔑 PASSWORD</div>
        <div class="quiz-card-body">{{ question.password }}</div>
    </div>

    <form action="/check_password" method="POST">
        <div style="display: flex; flex-direction: column; gap: 12px;">
            <button name="answer" value="strong" class="quiz-btn">
                💪 It's Strong
            </button>
            <button name="answer" value="weak" class="quiz-btn quiz-btn-outline">
                😬 It's Weak
            </button>
        </div>
    </form>

</div>
{% endblock %}
